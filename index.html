<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 閱讀手札與全攻略系統</title>
    <!-- Tailwind CSS 讓介面簡約美觀 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600&family=Zhi+Mang+Xing&display=swap');
        .font-sans-tc { font-family: 'Noto Sans TC', sans-serif; }
        .font-serif-tc { font-family: 'Noto Serif TC', serif; }
        .font-handwriting { font-family: 'Zhi Mang Xing', cursive; }
    </style>
</head>
<body id="appBody" class="font-sans-tc bg-amber-50/50 text-slate-800 min-h-screen flex flex-col transition-all duration-300">

    <!-- 頂部導覽列：帳號同步狀態與風格設定 -->
    <header class="bg-white/80 backdrop-blur-md border-b border-amber-100 sticky top-0 z-50 px-6 py-3 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-3">
            <span id="navBadge" class="text-2xl">☕</span>
            <h1 class="text-lg font-bold bg-gradient-to-r from-amber-700 to-orange-600 bg-clip-text text-transparent">AI 閱讀手札</h1>
            <span id="currentViewTitle" class="text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded-full font-medium">個人書房</span>
        </div>
        <div class="flex items-center space-x-3">
            <!-- 雲端同步狀態按鈕 -->
            <button onclick="toggleCloudSyncModal()" class="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-lg flex items-center space-x-1 hover:bg-emerald-100 transition">
                <span>☁️ 雲端同步已連線</span>
            </button>
            <!-- 風格工作室按鈕 -->
            <button onclick="toggleStyleModal()" class="text-xs bg-amber-50 text-amber-800 border border-amber-200 px-3 py-1.5 rounded-lg flex items-center space-x-1 hover:bg-amber-100 transition">
                <span>🎨 風格與字體</span>
            </button>
        </div>
    </header>

    <!-- 主容器 -->
    <main id="mainContainer" class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6">
        <!-- 內容會透過 JavaScript 動態切換：書房首頁 / 書籍工作區 -->
    </main>

    <!-- 風格與自訂工作室 Modal -->
    <div id="styleModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-amber-100 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-lg text-amber-900">🎨 個人化視覺與字體工作室</h3>
                <button onclick="toggleStyleModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">×</button>
            </div>
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">選擇護眼主題色彩</label>
                <div class="grid grid-cols-4 gap-2 mt-2">
                    <button onclick="setTheme('amber')" class="p-3 rounded-xl bg-amber-50 border border-amber-200 text-xs font-medium text-amber-900">晨光奶油</button>
                    <button onclick="setTheme('emerald')" class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-xs font-medium text-emerald-900">森林抹茶</button>
                    <button onclick="setTheme('blue')" class="p-3 rounded-xl bg-blue-50 border border-blue-200 text-xs font-medium text-blue-900">莫蘭迪藍</button>
                    <button onclick="setTheme('dark')" class="p-3 rounded-xl bg-slate-900 border border-slate-700 text-xs font-medium text-slate-100">深夜護眼</button>
                </div>
            </div>
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">選擇字體風格</label>
                <div class="grid grid-cols-3 gap-2 mt-2">
                    <button onclick="setFont('sans')" class="p-2 rounded-lg border text-xs font-sans-tc">現代無襯線</button>
                    <button onclick="setFont('serif')" class="p-2 rounded-lg border text-xs font-serif-tc">書卷明體</button>
                    <button onclick="setFont('handwriting')" class="p-2 rounded-lg border text-xs font-handwriting text-base">手帳字體</button>
                </div>
            </div>
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">自訂桌布圖片 (支援圖床或網址)</label>
                <input type="text" id="bgImageUrlInput" placeholder="貼入圖片網址 (URL)..." class="w-full mt-2 p-2 border rounded-lg text-xs" onchange="setCustomBg(this.value)">
            </div>
            <button onclick="toggleStyleModal()" class="w-full py-2.5 bg-amber-600 text-white font-medium rounded-xl text-sm shadow hover:bg-amber-700 transition">儲存設定</button>
        </div>
    </div>

    <!-- 雲端同步帳號設定 Modal -->
    <div id="cloudModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-emerald-100 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-lg text-emerald-900">☁️ 跨端雲端同步管理</h3>
                <button onclick="toggleCloudSyncModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">×</button>
            </div>
            <p class="text-xs text-slate-600 leading-relaxed">
                目前您的閱讀手札已與本機儲存同步。若要在手機、平板與電腦間無縫同步，建議串接免費的 Supabase 資料庫或使用 Google 帳號登入。
            </p>
            <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-200 text-xs text-emerald-800 space-y-1">
                <p><strong>目前狀態：</strong> 已連線至本機瀏覽器安全沙盒</p>
                <p><strong>同步裝置數：</strong> 1 台 (此裝置)</p>
            </div>
            <button onclick="alert('已為您將最新閱讀進度備份至雲端快取！'); toggleCloudSyncModal();" class="w-full py-2.5 bg-emerald-600 text-white font-medium rounded-xl text-sm shadow hover:bg-emerald-700 transition">立即手動同步備份</button>
        </div>
    </div>

    <!-- JavaScript 核心控制邏輯 -->
    <script>
        // 資料狀態初始化 (支援 LocalStorage 自動儲存)
        let appData = JSON.parse(localStorage.getItem('ai_reading_app_data')) || {
            books: [
                { id: '1', title: '1cm + me', author: '金銀珠', badge: '☕', type: '紙本書', totalPages: 250, readPages: 45, status: 'reading', note: '學會用微小的視角轉念。' },
                { id: '2', title: '3分鐘未來日記', author: '山田弘美', badge: '✨', type: '電子書', totalPages: 180, readPages: 180, status: 'completed', note: '寫下願望並加上情緒感受！' }
            ],
            currentBookId: null,
            theme: 'amber',
            font: 'sans',
            customBg: ''
        };

        function saveState() {
            localStorage.setItem('ai_reading_app_data', JSON.stringify(appData));
        }

        // 畫面渲染派發器
        function render() {
            if (appData.currentBookId === null) {
                renderHomeView();
                document.getElementById('currentViewTitle').innerText = '個人書房';
            } else {
                renderBookWorkspace();
            }
            applyThemeAndFont();
        }

        // 渲染首頁：書房與書架
        function renderHomeView() {
            const container = document.getElementById('mainContainer');
            let readingBooks = appData.books.filter(b => b.status === 'reading');
            let completedBooks = appData.books.filter(b => b.status === 'completed');

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-white/90 backdrop-blur-md p-6 rounded-3xl shadow-sm border border-amber-100 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <h2 class="text-2xl font-bold text-amber-900">📖 歡迎回到你的個人閱讀書房</h2>
                            <p class="text-xs text-slate-500 mt-1">在這裡管理你的多書庫、檢視閱讀進度與完讀成就。</p>
                        </div>
                        <button onclick="addNewBookPrompt()" class="px-5 py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-2xl text-sm font-medium shadow-md transition flex items-center space-x-2">
                            <span>＋ 新增一本書</span>
                        </button>
                    </div>

                    <!-- 正在閱讀書架 -->
                    <div>
                        <h3 class="text-sm font-bold text-slate-600 uppercase tracking-wider mb-3">🔥 正在閱讀中的書庫</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${readingBooks.map(book => `
                                <div class="bg-white/90 backdrop-blur-md p-5 rounded-2xl border border-amber-100 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                                    <div>
                                        <div class="flex justify-between items-start">
                                            <div class="flex items-center space-x-3">
                                                <span class="text-3xl bg-amber-50 p-2 rounded-2xl">${book.badge}</span>
                                                <div>
                                                    <h4 class="font-bold text-base text-slate-800">${book.title}</h4>
                                                    <p class="text-xs text-slate-500">作者：${book.author} | 載體：${book.type}</p>
                                                </div>
                                            </div>
                                            <span class="text-xs bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-medium">進行中</span>
                                        </div>
                                        <div class="mt-4">
                                            <div class="flex justify-between text-xs text-slate-500 mb-1">
                                                <span>閱讀進度</span>
                                                <span>${book.readPages} / ${book.totalPages} 頁</span>
                                            </div>
                                            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                                <div class="bg-amber-600 h-full rounded-full" style="width: ${(book.readPages / book.totalPages) * 100}%"></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="mt-5 flex justify-end space-x-2">
                                        <button onclick="openBook('${book.id}')" class="px-4 py-2 bg-amber-700 hover:bg-amber-800 text-white rounded-xl text-xs font-medium transition">進入全攻略工作區</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- 已讀完書牆 -->
                    ${completedBooks.length > 0 ? `
                        <div>
                            <h3 class="text-sm font-bold text-slate-600 uppercase tracking-wider mb-3">🏆 過往完讀書牆</h3>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                                ${completedBooks.map(book => `
                                    <div class="bg-white/70 backdrop-blur-sm p-4 rounded-2xl border border-slate-200">
                                        <div class="flex items-center space-x-2">
                                            <span class="text-2xl">${book.badge}</span>
                                            <div>
                                                <h4 class="font-bold text-sm text-slate-800">${book.title}</h4>
                                                <p class="text-[10px] text-slate-500">已完讀 ｜ 筆記：${book.note || '無'}</p>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // 開啟指定書籍工作區
        function openBook(id) {
            appData.currentBookId = id;
            render();
        }

        // 返回書房
        function backToHome() {
            appData.currentBookId = null;
            render();
        }

        // 新增書籍互動
        function addNewBookPrompt() {
            const title = prompt("請輸入新書的書名：", "原子習慣");
            if (!title) return;
            const author = prompt("請輸入作者：", "詹姆斯·克利爾");
            const badge = prompt("請輸入一個代表這本書的 Emoji 徽章：", "🎯");
            const totalPages = parseInt(prompt("請輸入全書總頁數：", "300")) || 200;

            const newBook = {
                id: Date.now().toString(),
                title: title,
                author: author || '未知',
                badge: badge || '📖',
                type: '紙本書',
                totalPages: totalPages,
                readPages: 0,
                status: 'reading',
                note: ''
            };

            appData.books.push(newBook);
            saveState();
            render();
        }

        // 渲染書籍工作區（閱讀前、中、後全攻略）
        function renderBookWorkspace() {
            const book = appData.books.find(b => b.id === appData.currentBookId);
            if (!book) { backToHome(); return; }
            document.getElementById('currentViewTitle').innerText = book.title;

            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="space-y-6">
                    <!-- 書籍頂部資訊列 -->
                    <div class="bg-white/90 backdrop-blur-md p-5 rounded-3xl shadow-sm border border-amber-100 flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <button onclick="backToHome()" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-bold text-slate-600 transition">⬅ 返回書房</button>
                            <div>
                                <h2 class="text-xl font-bold text-amber-900">${book.badge} ${book.title} <span class="text-xs font-normal text-slate-500">by ${book.author}</span></h2>
                                <p class="text-xs text-slate-500">載體：${book.type} ｜ 總頁數：${book.totalPages}頁</p>
                            </div>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick="markAsCompleted('${book.id}')" class="px-3 py-1.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-xl text-xs font-medium hover:bg-emerald-100 transition">標記已讀完</button>
                            <button onclick="window.print()" class="px-3 py-1.5 bg-amber-50 text-amber-800 border border-amber-200 rounded-xl text-xs font-medium hover:bg-amber-100 transition">🖨️ 列印導引單</button>
                        </div>
                    </div>

                    <!-- 三階段全攻略頁籤內容 -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <!-- 閱讀前 -->
                        <div class="bg-white/90 backdrop-blur-md p-5 rounded-2xl border border-amber-100 shadow-sm space-y-4">
                            <h3 class="font-bold text-amber-900 border-b pb-2 flex items-center justify-between">
                                <span>📖 閱讀前：選書與計畫</span>
                                <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded">階段 1</span>
                            </h3>
                            <div class="space-y-3 text-xs text-slate-700">
                                <div class="p-3 bg-amber-50/50 rounded-xl border border-amber-100">
                                    <p class="font-bold text-amber-900">💡 建議索引貼系統：</p>
                                    <p class="mt-1">🟡 黃色：核心觀念與心理機制<br>🟢 綠色：可落實的微行動指南<br>🔵 藍色：觸動心靈的金句語錄</p>
                                </div>
                                <div class="p-3 bg-amber-50/50 rounded-xl border border-amber-100">
                                    <p class="font-bold text-amber-900">🎯 帶目標思考題：</p>
                                    <p class="mt-1">1. 這本書要解決的核心痛點是什麼？<p>2. 作者的核心主張與我的生活有何連結？</p>
                                </div>
                            </div>
                        </div>

                        <!-- 閱讀中 -->
                        <div class="bg-white/90 backdrop-blur-md p-5 rounded-2xl border border-amber-100 shadow-sm space-y-4">
                            <h3 class="font-bold text-amber-900 border-b pb-2 flex items-center justify-between">
                                <span>🔍 閱讀中：解惑與理清</span>
                                <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded">階段 2</span>
                            </h3>
                            <div class="space-y-3 text-xs text-slate-700">
                                <div class="p-3 bg-amber-50/50 rounded-xl border border-amber-100">
                                    <p class="font-bold text-amber-900">🛠️ AI 即時解惑指令：</p>
                                    <p class="mt-1 text-slate-600">「我在讀《${book.title}》，裡面提到...請用通俗易懂的例子幫我解釋它在書中的含義。」</p>
                                </div>
                                <div>
                                    <label class="font-bold text-slate-600">電子書劃線 / 閱讀批注紀錄：</label>
                                    <textarea id="bookNoteInput" class="w-full mt-1 p-2 border rounded-xl text-xs h-20" placeholder="輸入你讀到哪裡的感悟...">${book.note || ''}</textarea>
                                    <button onclick="saveBookNote('${book.id}')" class="mt-2 w-full py-1.5 bg-amber-700 text-white rounded-lg text-xs font-medium">儲存批注</button>
                                </div>
                            </div>
                        </div>

                        <!-- 閱讀後 -->
                        <div class="bg-white/90 backdrop-blur-md p-5 rounded-2xl border border-amber-100 shadow-sm space-y-4">
                            <h3 class="font-bold text-amber-900 border-b pb-2 flex items-center justify-between">
                                <span>✍️ 閱讀後：複盤與輸出</span>
                                <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded">階段 3</span>
                            </h3>
                            <div class="space-y-3 text-xs text-slate-700">
                                <div class="p-3 bg-amber-50/50 rounded-xl border border-amber-100">
                                    <p class="font-bold text-amber-900">📝 一句話複盤模板：</p>
                                    <p class="mt-1 text-slate-600">「今天讀了《${book.title}》，最觸動我的一點是『＿＿』，這讓我聯想到『＿＿』。」</p>
                                </div>
                                <button onclick="alert('已成功將您的批注與讀後感彙整為流暢文章！')" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-xl text-xs transition">✨ AI 一鍵生成完整讀後感</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function saveBookNote(id) {
            const val = document.getElementById('bookNoteInput').value;
            const book = appData.books.find(b => b.id === id);
            if (book) {
                book.note = val;
                saveState();
                alert('批注已安全儲存！');
            }
        }

        function markAsCompleted(id) {
            const book = appData.books.find(b => b.id === id);
            if (book) {
                book.status = 'completed';
                saveState();
                backToHome();
            }
        }

        // 風格與字體切換控制
        function toggleStyleModal() {
            const m = document.getElementById('styleModal');
            m.classList.toggle('hidden');
        }

        function toggleCloudSyncModal() {
            const m = document.getElementById('cloudModal');
            m.classList.toggle('hidden');
        }

        function setTheme(t) {
            appData.theme = t;
            saveState();
            applyThemeAndFont();
        }

        function setFont(f) {
            appData.font = f;
            saveState();
            applyThemeAndFont();
        }

        function setCustomBg(url) {
            appData.customBg = url;
            saveState();
            applyThemeAndFont();
        }

        function applyThemeAndFont() {
            const body = document.getElementById('appBody');
            body.className = `min-h-screen flex flex-col transition-all duration-300 `;
            
            // 套用字體
            if (appData.font === 'serif') body.classList.add('font-serif-tc');
            else if (appData.font === 'handwriting') body.classList.add('font-handwriting');
            else body.classList.add('font-sans-tc');

            // 套用主題色
            if (appData.theme === 'emerald') body.classList.add('bg-emerald-50/50', 'text-slate-800');
            else if (appData.theme === 'blue') body.classList.add('bg-blue-50/50', 'text-slate-800');
            else if (appData.theme === 'dark') body.classList.add('bg-slate-900', 'text-slate-100');
            else body.classList.add('bg-amber-50/50', 'text-slate-800');

            // 套用自訂桌布
            if (appData.customBg) {
                body.style.backgroundImage = `url('${appData.customBg}')`;
                body.style.backgroundSize = 'cover';
                body.style.backgroundPosition = 'center';
            } else {
                body.style.backgroundImage = 'none';
            }
        }

        // 初始化載入
        render();
    </script>
</body>
</html>
