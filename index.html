  <script>
    // ==================== 🛡️ 嚴密資安與加密防護模組 (Security Guard) ====================
    const SecurityGuard = {
      // 1. XSS 跨站腳本防禦：跳脫 HTML 特殊字元
      escapeHTML(str) {
        if (typeof str !== 'string') return '';
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      },

      // 2. URL 白名單過濾：阻擋 javascript: 等危險協定
      sanitizeUrl(url) {
        if (!url || typeof url !== 'string') return '';
        const trimmed = url.trim();
        const isSafeHttp = /^https?:\/\/[^\s"'<>]+$/i.test(trimmed);
        const isSafeDataImg = /^data:image\/(png|jpeg|jpg|gif|webp);base64,[a-z0-9+/=]+$/i.test(trimmed);
        if (isSafeHttp || isSafeDataImg) return trimmed;
        alert('⚠️ 安全警告：偵測到不安全的網址格式，已自動攔截！');
        return '';
      },

      // 3. 字串長度截斷與清理
      sanitizeInput(str, maxLength = 1000) {
        if (typeof str !== 'string') return '';
        return str.trim().slice(0, maxLength);
      },

      // 4. 防連點節流保護 (Rate Limiter)
      lastActionTime: 0,
      checkRateLimit(cooldownMs = 600) {
        const now = Date.now();
        if (now - this.lastActionTime < cooldownMs) return false;
        this.lastActionTime = now;
        return true;
      },

      // 5. 密碼學級 AES-GCM 加密備份
      async encryptData(dataObj, password) {
        const enc = new TextEncoder();
        const salt = window.crypto.getRandomValues(new Uint8Array(16));
        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        
        // 透過 PBKDF2 從密碼衍生金鑰
        const baseKey = await window.crypto.subtle.importKey(
          "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
        );
        const aesKey = await window.crypto.subtle.deriveKey(
          { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
          baseKey, { name: "AES-GCM", length: 256 }, false, ["encrypt"]
        );

        const ciphertext = await window.crypto.subtle.encrypt(
          { name: "AES-GCM", iv }, aesKey, enc.encode(JSON.stringify(dataObj))
        );

        // 組合 salt + iv + ciphertext 並轉換為 Base64
        const combined = new Uint8Array(salt.length + iv.length + ciphertext.byteLength);
        combined.set(salt, 0);
        combined.set(iv, salt.length);
        combined.set(new Uint8Array(ciphertext), salt.length + iv.length);
        
        return btoa(String.fromCharCode(...combined));
      },

      // 6. AES-GCM 解密還原
      async decryptData(base64Str, password) {
        const enc = new TextEncoder();
        const dec = new TextDecoder();
        const binStr = atob(base64Str);
        const bytes = new Uint8Array(binStr.length);
        for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);

        const salt = bytes.slice(0, 16);
        const iv = bytes.slice(16, 28);
        const ciphertext = bytes.slice(28);

        const baseKey = await window.crypto.subtle.importKey(
          "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
        );
        const aesKey = await window.crypto.subtle.deriveKey(
          { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
          baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
        );

        const decrypted = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv }, aesKey, ciphertext
        );
        return JSON.parse(dec.decode(decrypted));
      }
    };

    // ==================== 雲端資料庫 RLS (Row Level Security) 安全規則範例 ====================
    /*
      【Supabase RLS 安全政策設定範例】
      當未來將此 App 串接至 Supabase 雲端資料庫時，請在 SQL 編輯器執行以下指令，
      確保每位使用者只能讀寫自己的專屬筆記，防止資料外洩：

      -- 1. 啟用資料表的 Row Level Security
      ALTER TABLE user_books ENABLE ROW LEVEL SECURITY;

      -- 2. 建立強制隔離政策：使用者只能操作 user_id 等於自己的資料列
      CREATE POLICY "使用者只能存取自己的書房資料" ON user_books
        FOR ALL
        USING (auth.uid() = user_id)
        WITH CHECK (auth.uid() = user_id);
    */

    // ==================== 資料狀態與安全載入 ====================
    const STORAGE_KEY = 'ai_reading_secure_v2';

    const DEFAULT_STATE = {
      activeView: 'library',
      activeBookId: 'book_1',
      theme: 'cream',
      accentColor: '#D97757',
      books: [
        {
          id: 'book_1',
          title: '1cm + me',
          author: '金銀珠',
          status: 'reading',
          badgeEmoji: '🌿',
          tags: [
            { id: 't1', color: '#F59E0B', name: '轉念視角', desc: '換個角度看日常' },
            { id: 't2', color: '#10B981', name: '行動靈感', desc: '微小實驗' }
          ],
          preQuestions: ['這本書想解決的核心痛點是什麼？', '作者提出了什麼獨特視角？'],
          notes: [],
          finalEssay: ''
        }
      ]
    };

    function loadSafeState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const parsed = JSON.parse(saved);
        if (!parsed || !Array.isArray(parsed.books) || parsed.books.length === 0) {
          throw new Error('資料結構異常');
        }
        return parsed;
      } catch (e) {
        console.warn('偵測到本機資料異常，已安全還原預設狀態', e);
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    let appState = loadSafeState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        alert('⚠️ 儲存失敗：瀏覽器空間已滿。');
      }
    }

    function getCurrentBook() {
      return appState.books.find(b => b.id === appState.activeBookId) || appState.books[0];
    }

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = 'px-4 py-2.5 rounded-2xl shadow-lg text-xs font-medium accent-bg flex items-center gap-2';
      el.innerHTML = `<span>✨</span><span>${SecurityGuard.escapeHTML(msg)}</span>`;
      container.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    // ==================== 一鍵加密備份與還原實作 ====================
    function openBackupModal() { document.getElementById('backup-modal').classList.remove('hidden'); }
    function closeBackupModal() { document.getElementById('backup-modal').classList.add('hidden'); }

    async function exportEncryptedBackup() {
      const pwd = document.getElementById('backup-password-input').value;
      if (!pwd || pwd.length < 6) {
        alert('⚠️ 為了資料安全，請設定至少 6 位數的加密密碼！');
        return;
      }
      try {
        const encryptedStr = await SecurityGuard.encryptData(appState, pwd);
        const blob = new Blob([encryptedStr], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ai_reading_backup_${new Date().toISOString().slice(0, 10)}.enc`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('🔐 加密備份檔已成功匯出！');
        closeBackupModal();
      } catch (e) {
        alert('❌ 備份加密失敗：' + e.message);
      }
    }

    async function importEncryptedBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const pwd = document.getElementById('backup-password-input').value;
      if (!pwd) {
        alert('⚠️ 請先在上方輸入當初設定的解密密碼才能還原！');
        return;
      }

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const decryptedData = await SecurityGuard.decryptData(e.target.result, pwd);
          if (!decryptedData || !Array.isArray(decryptedData.books)) {
            throw new Error('檔案格式不正確');
          }
          appState = decryptedData;
          saveState();
          navigateToLibrary();
          showToast('🎉 資料還原成功！書房已更新。');
          closeBackupModal();
        } catch (err) {
          alert('❌ 還原失敗：密碼錯誤或備份檔已損毀！');
        }
      };
      reader.readAsText(file);
    }

    // ==================== 視圖渲染與防護輸出 ====================
    function navigateToLibrary() {
      appState.activeView = 'library';
      saveState();
      document.getElementById('view-workspace').classList.add('hidden');
      document.getElementById('view-library').classList.remove('hidden');
      renderLibraryView();
      lucide.createIcons();
    }

    function openBookWorkspace(bookId) {
      const target = appState.books.find(b => b.id === bookId);
      if (!target) return;
      appState.activeBookId = bookId;
      appState.activeView = 'workspace';
      saveState();
      document.getElementById('view-library').classList.add('hidden');
      document.getElementById('view-workspace').classList.remove('hidden');
      renderWorkspaceView();
      lucide.createIcons();
    }

    function renderLibraryView() {
      const readingBooks = appState.books.filter(b => b.status !== 'completed');
      const completedBooks = appState.books.filter(b => b.status === 'completed');

      document.getElementById('reading-books-grid').innerHTML = readingBooks.map(book => `
        <div onclick="openBookWorkspace('${SecurityGuard.escapeHTML(book.id)}')" class="cursor-pointer glass-card border rounded-3xl p-5 shadow-sm hover:shadow-md transition-all">
          <div class="flex items-center gap-3.5">
            <div class="w-12 h-12 rounded-2xl border border-custom flex items-center justify-center text-2xl">${SecurityGuard.escapeHTML(book.badgeEmoji || '📖')}</div>
            <div class="flex-1 min-w-0">
              <h3 class="font-bold text-base truncate">${SecurityGuard.escapeHTML(book.title)}</h3>
              <p class="text-xs text-muted-custom truncate">${SecurityGuard.escapeHTML(book.author || '')}</p>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderWorkspaceView() {
      const book = getCurrentBook();
      if (!book) return;
      document.getElementById('ws-book-title').value = book.title;
      document.getElementById('final-essay-output').value = book.finalEssay || '';
      renderNotesList();
    }

    function updateCurrentBookMeta() {
      if (!SecurityGuard.checkRateLimit(300)) return;
      const book = getCurrentBook();
      book.title = SecurityGuard.sanitizeInput(document.getElementById('ws-book-title').value, 50) || '未命名書籍';
      saveState();
    }

    function openNewBookModal() { document.getElementById('new-book-modal').classList.remove('hidden'); }
    function closeNewBookModal() { document.getElementById('new-book-modal').classList.add('hidden'); }

    function createNewBook() {
      if (!SecurityGuard.checkRateLimit()) return;
      const title = SecurityGuard.sanitizeInput(document.getElementById('nb-title').value, 50);
      if (!title) { showToast('請輸入書名'); return; }
      const author = SecurityGuard.sanitizeInput(document.getElementById('nb-author').value, 30) || '未知作者';

      const newBook = {
        id: 'book_' + Date.now(),
        title, author, status: 'reading', badgeEmoji: '📘', tags: [], preQuestions: [], notes: [], finalEssay: ''
      };

      appState.books.unshift(newBook);
      saveState();
      closeNewBookModal();
      openBookWorkspace(newBook.id);
      showToast('新書建立成功！');
    }

    function addReadingNote() {
      if (!SecurityGuard.checkRateLimit()) return;
      const book = getCurrentBook();
      const quote = SecurityGuard.sanitizeInput(document.getElementById('note-quote-input').value, 500);
      if (!quote) { showToast('請輸入摘錄內容'); return; }

      book.notes.unshift({ id: 'note_' + Date.now(), quote });
      saveState();
      document.getElementById('note-quote-input').value = '';
      renderNotesList();
      showToast('批注已安全儲存！');
    }

    function renderNotesList() {
      const book = getCurrentBook();
      document.getElementById('notes-list-container').innerHTML = book.notes.map(n => `
        <div class="p-4 rounded-2xl border border-custom space-y-1">
          <blockquote class="text-xs italic text-muted-custom">「${SecurityGuard.escapeHTML(n.quote)}」</blockquote>
        </div>
      `).join('');
    }

    function saveCurrentEssay() {
      if (!SecurityGuard.checkRateLimit(1000)) return;
      const book = getCurrentBook();
      book.finalEssay = SecurityGuard.sanitizeInput(document.getElementById('final-essay-output').value, 3000);
      saveState();
    }

    function toggleStyleDrawer() {
      document.getElementById('style-drawer').classList.toggle('translate-x-full');
    }

    function setTheme(t) {
      appState.theme = t;
      document.documentElement.setAttribute('data-theme', t);
      saveState();
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTheme(appState.theme);
      if (appState.activeView === 'workspace') {
        openBookWorkspace(appState.activeBookId);
      } else {
        navigateToLibrary();
      }
    });
  </script>
</body>
</html>
